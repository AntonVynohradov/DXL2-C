site_name: DXL2-C
site_description: >-
  Hardware-agnostic DYNAMIXEL Protocol 2.0 library in C for embedded systems:
  no heap, no RTOS, MISRA C:2012, 100 % test coverage.
site_author: Anton Vynohradov
site_url: https://antonvynohradov.github.io/dxl2-c/
repo_url: https://github.com/AntonVynohradov/DXL2-C
repo_name: AntonVynohradov/DXL2-C
edit_uri: ""
copyright: >-
  Copyright &copy; 2026 Anton Vynohradov ·
  <a href="https://systemfromscratch.com">SystemFromScratch®</a> ·
  Licensed under the <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache License 2.0</a>

nav:
  - Home: index.md
  - Guide:
      - Introduction: overview.md
      - Getting Started: guide.md
      - How It Works: architecture.md
      - Using the Library: usage.md
      - Extending the Library: extending.md
      - Configuration: configuration.md
  - Protocol: protocol.md
  - Integration:
      - Integration Guide: integration.md
      - Examples: examples.md
      - DXL2 Studio (GUI): gui.md
  - Reference:
      - API Reference: api.md
      - Doxygen:
          - Modules: reference/modules.md
