  - About:
      - Author & Company: about.md
      - License: LICENSE.md

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AntonVynohradov
      name: Anton Vynohradov on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/vynohradov
      name: Anton Vynohradov on LinkedIn
    - icon: material/web
      link: https://systemfromscratch.com
      name: SystemFromScratch®

  # ---------------------------------------------------------------- landing page
  # Rendered by overrides/home.html (sfs-protocol-library skill template). Story:
  # hero -> the problem (3 problem->solution cards) -> what you get (6 linked cards)
  # -> measured stats -> quick start (docs/index.md) -> SystemFromScratch® banner.
  landing:
    eyebrow: Open-source embedded library
    title: DYNAMIXEL Protocol 2.0
    accent: in portable C
    lead: >-
      DXL2-C turns a noisy half-duplex byte stream into validated DYNAMIXEL packets, and
      your replies back into bytes on the wire — with no heap, no RTOS and code that
      passes MISRA C:2012.
    hero_image: assets/images/hero-3d.svg
    hero_alt: >-
      Isometric illustration: the DXL2-C chip filters a noisy bus and sends clean packets
      to three servos
    buttons:
      - {text: Get started, link: guide/, style: primary}
      - {text: View on GitHub, link: "https://github.com/AntonVynohradov/DXL2-C", style: outline}
    features:
      - {icon: chip, line1: No heap, line2: No RTOS}
      - {icon: shield, line1: MISRA C:2012, line2: 0 violations}
      - {icon: flask, line1: 100 % line &, line2: branch coverage}
      - {icon: code, line1: Apache-2.0, line2: open source}
    problem:
      eyebrow: The problem
      title: One wire, many servos, no second chance
      intro: >-
        DYNAMIXEL devices share a single half-duplex line. Every byte can be lost or
        corrupted, every node must frame, check and answer packets exactly as the
        specification says — on a microcontroller with a few kilobytes of RAM and, often,
        a safety argument to make.
      cards:
        - icon: wave
          title: Noisy, shared bus
          text: >-
            Bytes arrive in any chunking, with noise and gaps. DXL2-C finds headers in the
            stream, checks Length and CRC, removes byte stuffing and resynchronizes by itself.
          tags: [CRC-16, Byte stuffing, Resync]
        - icon: memory
          title: Tight embedded budgets
          text: >-
            About 550 bytes of RAM per bus and a fixed, measured stack. No allocation, no
            globals, no OS: the same code runs bare metal, under an RTOS and on a PC.
          tags: [Static memory, Bare metal, Zephyr]
        - icon: shield
          title: Code you can certify
          text: >-
            Zero MISRA C:2012 violations, a documented deviation register, 100 % line and
            branch coverage and static analysis in CI — reviewable in an afternoon.
          tags: [MISRA C, Cppcheck, CodeQL]
    offer:
      eyebrow: What you get
      title: A small library with a clear job
      intro: >-
        Two layers and ten functions: a codec for the wire format and a link that connects
        it to any transport through two callbacks.
      cards:
        - icon: layers
          title: Codec and link
          text: >-
            Incremental parser, encoder with byte stuffing, CRC-16 and a transport-independent
            link that dispatches packets to your handler.
          tags: [dxl2_protocol, dxl2_link]
          link: architecture/
        - icon: plug
          title: Any transport
          text: >-
            UART, RS-485, USB, TCP or a simulator: pass received bytes in, provide a write
            function. Threading stays under your control.
          tags: [UART, RS-485, USB / TCP]
          link: integration/
        - icon: brackets
          title: Working examples
          text: >-
            A bare-metal device tested in CI on a simulated board, a serial-port PING tool
            for Linux, macOS and Windows, and a Zephyr application.
          tags: [Bare metal, Zephyr, Host]
          link: examples/
        - icon: monitor
          title: DXL2 Studio
          text: >-
            A desktop GUI on the same library: simulate a device, talk to real hardware and
            inspect every packet field by field.
          tags: [Simulator, Bus scan, Debugger]
          link: gui/
        - icon: document
          title: Complete documentation
          text: >-
            How it works, how to use and extend it, the wire format, a full API reference
            and a printable PDF manual.
          tags: [API, Guides, PDF]
          link: api/
        - icon: check
          title: Quality gates in CI
          text: >-
            Every pull request runs the unit tests with a 100 % coverage gate, the MISRA
            check, Cppcheck, CodeQL and the examples.
          tags: [GoogleTest, pytest, Coverage]
          link: misra/
    stats:
      - {value: "10", label: public functions}
      - {value: "≈ 550 B", label: RAM per bus}
      - {value: "≤ 600 B", label: stack on Cortex-M4}
      - {value: "0", label: MISRA C:2012 violations}
    portfolio:
      title: Part of an open-source embedded portfolio
      text: >-
        DXL2-C is developed by Anton Vynohradov under SystemFromScratch® — embedded software
        and hardware built from the first schematic to certification.
      buttons:
        - {text: SystemFromScratch®, link: "https://systemfromscratch.com", style: primary}
        - {text: About the author, link: about/, style: outline}
    trademark: >-
      SystemFromScratch® is a registered trademark. DYNAMIXEL and ROBOTIS are trademarks of
      ROBOTIS Co., Ltd. DXL2-C is an independent implementation of the publicly documented
      protocol and is not affiliated with or endorsed by ROBOTIS.

  # ---------------------------------------------------------------- PDF manual
  # Read by tools/docs/build_manual.py (sfs-protocol-library skill).
  manual:
    title: DXL2-C
    subtitle: DYNAMIXEL Protocol 2.0 Library for Embedded Systems
    version_header: dxl2.h
    version_macro: DXL2_VERSION
    output: build/manual/DXL2-C_User_Manual_v{version}.pdf
    cover_image: assets/images/bus-topology.svg
    appendices: [changelog.md, LICENSE.md]
    unnumbered: [about.md]
    web_only: [index.md, reference/]
    keywords: DYNAMIXEL, Protocol 2.0, embedded, C, MISRA C:2012, ROBOTIS
    vendor_trademarks: >-
      DYNAMIXEL and ROBOTIS are trademarks of ROBOTIS Co., Ltd. They are used only to
      identify the protocol that DXL2-C implements. DXL2-C is an independent implementation
      and is not affiliated with or endorsed by ROBOTIS.

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search
  - autorefs
  - mkdoxy:
      projects:
        reference:
          src-dirs: dxl2.h inc src
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.c *.h"
            RECURSIVE: True
            EXTRACT_STATIC: True
            JAVADOC_AUTOBRIEF: True

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
