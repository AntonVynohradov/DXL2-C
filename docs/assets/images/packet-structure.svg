<text x="540.0" y="118" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">1 byte</text>
<text x="700.0" y="40" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#5A6472" text-anchor="middle">Parameters</text>
<rect x="600.0" y="52" width="50.0" height="46" rx="4" fill="#5A6472" stroke="#FFFFFF" stroke-width="2"/>
