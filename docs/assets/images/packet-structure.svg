<text x="140.0" y="118" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">4 bytes</text>
<text x="310.0" y="40" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#0F8B9A" text-anchor="middle">ID</text>
<rect x="270.0" y="52" width="80.0" height="46" rx="4" fill="#0F8B9A" stroke="#FFFFFF" stroke-width="2"/>
<text x="310.0" y="81" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ID</text>
<text x="310.0" y="118" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">1 byte</text>
<text x="420.0" y="40" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E5AA8" text-anchor="middle">Length</text>
<rect x="360.0" y="52" width="60.0" height="46" rx="4" fill="#1E5AA8" stroke="#FFFFFF" stroke-width="2"/>
<text x="390.0" y="81" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LEN_L</text>
<rect x="420.0" y="52" width="60.0" height="46" rx="4" fill="#1E5AA8" stroke="#FFFFFF" stroke-width="2"/>
<text x="450.0" y="81" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LEN_H</text>
<text x="420.0" y="118" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">2 bytes</text>
<text x="540.0" y="40" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#E07A00" text-anchor="middle">Instruction</text>
<rect x="490.0" y="52" width="100.0" height="46" rx="4" fill="#E07A00" stroke="#FFFFFF" stroke-width="2"/>
