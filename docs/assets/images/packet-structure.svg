<rect x="650.0" y="52" width="50.0" height="46" rx="4" fill="#5A6472" stroke="#FFFFFF" stroke-width="2"/>
<text x="675.0" y="81" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">P2</text>
<rect x="700.0" y="52" width="50.0" height="46" rx="4" fill="#5A6472" stroke="#FFFFFF" stroke-width="2"/>
<text x="725.0" y="81" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">…</text>
<rect x="750.0" y="52" width="50.0" height="46" rx="4" fill="#5A6472" stroke="#FFFFFF" stroke-width="2"/>
