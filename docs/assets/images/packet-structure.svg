<rect x="875.0" y="52" width="65.0" height="46" rx="4" fill="#0B2545" stroke="#FFFFFF" stroke-width="2"/>
<text x="907.5" y="81" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CRC_H</text>
<text x="875.0" y="118" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">2 bytes</text>
<path d="M490,142 L490,150 L940,150 L940,142" stroke="#1E5AA8" stroke-width="1.6" fill="none"/>
<text x="715.0" y="168" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E5AA8" text-anchor="middle">Length = Instruction + Parameters (after stuffing) + CRC</text>
<path d="M20,192 L20,200 L800,200 L800,192" stroke="#0B2545" stroke-width="1.6" fill="none"/>
<text x="410.0" y="218" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="normal" fill="#0B2545" text-anchor="middle">CRC-16 (poly 0x8005) over Header … last Parameter, on the wire bytes</text>
<text x="20" y="262" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B2545" text-anchor="start">Example: PING to ID 1</text>
