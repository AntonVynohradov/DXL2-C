<text x="700.0" y="118" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">0 … n bytes</text>
<text x="875.0" y="40" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#0B2545" text-anchor="middle">CRC</text>
<rect x="810.0" y="52" width="65.0" height="46" rx="4" fill="#0B2545" stroke="#FFFFFF" stroke-width="2"/>
