<path d="M380,186 C380,140 340,130 340,84" stroke="#1E5AA8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="330" y="126" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="normal" fill="#1E5AA8" text-anchor="end">parser: check CRC, then remove the FD</text>
<text x="450" y="268" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">The Length field and the CRC cover the stuffed bytes. FF FF FD not followed by FD is a malformed packet.</text>
