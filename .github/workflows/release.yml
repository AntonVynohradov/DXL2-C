#******************************************************************************
# DXL2-C: DYNAMIXEL Protocol 2.0 Implementation
#
# Project:     DXL2-C - Hardware-Agnostic DYNAMIXEL Protocol 2.0 Library
# Description: Release on a vX.Y.Z tag: check the version, run every quality
#              gate, publish the static library, headers, MISRA report and PDF
#              user manual as a GitHub Release.
#
# Author:      Anton Vynohradov
# Email:       avynohradov@systemfromscratch.com
#
# License:     Apache License 2.0
# Copyright (c) 2026 Anton Vynohradov
#
# SPDX-License-Identifier: Apache-2.0
#*****************************************************************************

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version consistency
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          grep -q "set(DXL2_DEFAULT_VERSION \"$VERSION\")" cmake/version.cmake \
            || { echo "cmake/version.cmake: DXL2_DEFAULT_VERSION is not $VERSION"; exit 1; }
          grep -q "#define DXL2_VERSION \"$VERSION\"" dxl2.h \
            || { echo "dxl2.h: DXL2_VERSION is not $VERSION"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md \
            || { echo "CHANGELOG.md has no [$VERSION] section"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev gcovr cppcheck libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install pytest mkdocs-material weasyprint

      - name: Unit tests and coverage gate
        run: |
          cmake --preset "DXL2[UnitTests]" -B "build/DXL2[UnitTests]"
          cmake --build "build/DXL2[UnitTests]" --target coverage

      - name: Integration tests
        run: |
          cmake --preset "DXL2[IntegrationTests]" -B "build/DXL2[IntegrationTests]" -DPython3_EXECUTABLE="$(which python)"
          cmake --build "build/DXL2[IntegrationTests]" --target integration_tests

      - name: MISRA C:2012 gate
        run: |
          cmake --preset "DXL2[Debug]" -B "build/DXL2[Debug]"
          cmake --build "build/DXL2[Debug]" --target misra-analyze

      - name: Examples
        run: |
          cmake --preset "DXL2[Examples]" -B "build/DXL2[Examples]"
          cmake --build "build/DXL2[Examples]"
          ctest --test-dir "build/DXL2[Examples]" -L example --output-on-failure

      - name: Build release library
        run: |
          cmake --preset "DXL2[Release]" -B "build/DXL2[Release]"
          cmake --build "build/DXL2[Release]"

      - name: Package
        run: |
          PKG="dxl2-c-$VERSION-linux-x86_64"
          mkdir -p "$PKG/lib" "$PKG/include"
          cp "build/DXL2[Release]/libdxl2.a" "$PKG/lib/"
          cp dxl2.h inc/*.h "$PKG/include/"
          cp LICENSE README.md CHANGELOG.md "$PKG/"
          tar -czf "$PKG.tar.gz" "$PKG"
          cp "build/DXL2[Debug]/misra.txt" "dxl2-c-$VERSION-misra.txt"
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: PDF manual
        run: python tools/docs/build_manual.py --output "dxl2-c-$VERSION-user-manual.pdf"

      - name: Release notes from CHANGELOG
        run: |
          awk -v h="## [$VERSION]" '
            index($0, h) == 1 { found = 1; next }
            found && (index($0, "## [") == 1 || index($0, "[Unreleased]:") == 1) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "DXL2-C $VERSION" \
            --notes-file release-notes.md \
            "$PKG.tar.gz" "dxl2-c-$VERSION-misra.txt" "dxl2-c-$VERSION-user-manual.pdf"
