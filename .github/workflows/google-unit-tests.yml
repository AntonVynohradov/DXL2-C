name: Google Unit Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Google Test and gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev gcovr

      - name: Configure (UnitTests preset)
        run: cmake --preset "DXL2[UnitTests]" -B "build/DXL2[UnitTests]"

      - name: Build (coverage)
        run: cmake --build "build/DXL2[UnitTests]" --target coverage

      - name: Test
        run: ctest --test-dir "build/DXL2[UnitTests]" --output-on-failure

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/DXL2\[UnitTests\]/Coverage
